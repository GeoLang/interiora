[package]
name = "interiora-server"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "HTTP API over interiora-core — venue catalogue, floor GeoJSON, indoor routing, positioning"

[dependencies]
interiora-core = { path = "../interiora-core" }
axum = "0.8"
platform-auth = { git = "https://github.com/GeoLang/platform-crates.git", branch = "master" }
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread"] }
tower-http = { version = "0.7", features = ["cors"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
# aws_lc_rs, not rust_crypto: rust_crypto pulls rsa 0.9 (RUSTSEC-2023-0071)
jsonwebtoken = { version = "11", default-features = false, features = ["aws_lc_rs"] }
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
